<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --tang:#FF5A36; --lilac:#B7A6FF; --ink:#15131C; --paper:#F7F4EE; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:#0b1030; }
      #root { position:relative; width:1080px; height:1920px; overflow:hidden; font-family:Inter, sans-serif; }
      #stage { position:absolute; inset:0; transform-origin:50% 45%; }
      #scene { position:absolute; inset:0; width:1080px; height:1920px; }
      .pill { position:absolute; top:300px; left:0; width:1080px; text-align:center; perspective:600px; z-index:5; }
      .pin { display:inline-block; background:#0d0c12; color:#fff; font-weight:900; font-size:44px; letter-spacing:.05em; padding:16px 34px; border-radius:24px; box-shadow:0 10px 30px rgba(0,0,0,.45); }
      .pin b { color:var(--tang); }
      .hook { position:absolute; top:520px; left:0; width:1080px; text-align:center; z-index:6; }
      .hin { display:block; padding:0 150px; transform-origin:50% 50%; }
      .hw { display:inline-block; margin:0 .1em; font-weight:900; font-size:118px; line-height:1.02; color:#fff; -webkit-text-stroke:16px #000; paint-order:stroke fill; text-shadow:0 10px 0 #000; }
      .hw.hl { color:var(--tang); font-size:150px; }
      .grp { position:absolute; top:1010px; left:0; width:1080px; text-align:center; z-index:6; }
      .gin { display:block; padding:0 140px; transform-origin:50% 50%; }
      .w { display:inline-block; margin:0 .04em; font-weight:900; font-size:96px; line-height:1.15; color:#fff; -webkit-text-stroke:14px #000; paint-order:stroke fill; text-shadow:0 8px 0 #000; padding:0 14px; border-radius:22px; }
      .w.hl { color:#FFD23A; }
      .cta { position:absolute; top:1125px; left:0; width:1080px; text-align:center; z-index:7; }
      .cin { display:inline-block; background:var(--tang); color:var(--ink); font-weight:900; font-size:40px; padding:20px 34px; border-radius:36px; box-shadow:0 14px 0 #000; }
      .flash { position:absolute; inset:0; z-index:8; pointer-events:none; }
      .fin { position:absolute; inset:0; background:#fff; mix-blend-mode:screen; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="%DUR%" data-width="1080" data-height="1920">
      <div id="stage"><canvas id="scene" width="1080" height="1920"></canvas></div>
      %CLIPS%
    </div>
    <script>
      window.__WORDS = %WORDS%;
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["scene"] = new Promise((r) => { window.__sceneReady = r; });
    </script>
    <script type="module" src="lib/scene.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });
      %JS%
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
