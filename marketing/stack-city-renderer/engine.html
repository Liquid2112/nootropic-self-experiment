<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:540px;height:960px;overflow:hidden;background:#0b1030;font-family:Inter, sans-serif}
#c{position:absolute;inset:0}
#pill{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#0d0c12;color:#fff;font-weight:900;font-size:22px;letter-spacing:.04em;padding:10px 20px;border-radius:14px;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#pill:empty{display:none}
#pill b{color:#FF5A36}
#cap{position:absolute;top:590px;left:24px;right:24px;text-align:center;font-weight:900;font-size:50px;line-height:1.08;color:#fff;
 -webkit-text-stroke:10px #000;paint-order:stroke fill;text-shadow:0 5px 0 #000}
#cap span{display:inline-block;margin:0 .14em;transform-origin:50% 80%}
#cap .hl{color:#FF5A36}
#cap .now{transform:scale(1.13)}
#cta{position:absolute;left:50%;top:800px;transform:translateX(-50%) scale(var(--s,0));background:#FF5A36;color:#15131C;font-weight:900;font-size:30px;padding:14px 26px;border-radius:20px;white-space:nowrap;box-shadow:0 8px 0 #000}
</style></head><body>
<canvas id="c" width="540" height="960"></canvas>
<div id="pill"></div><div id="cap"></div><div id="cta"></div>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const Q=new URLSearchParams(location.search);
const EP=await import('./episodes/'+Q.get('ep')+'.js');
const WORDS=await (await fetch('./vo/'+Q.get('ep')+'.json')).json();

// ---------- core ----------
const TANG=0xFF5A36, LIL=0xB7A6FF, INK=0x15131C, PAPER=0xF7F4EE;
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(window.devicePixelRatio);renderer.setSize(540,960);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;
const scene=new THREE.Scene();
{const cv=document.createElement('canvas');cv.width=4;cv.height=256;const g=cv.getContext('2d');
 const gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#1b1460');gr.addColorStop(.55,'#0e1a4a');gr.addColorStop(1,'#060818');
 g.fillStyle=gr;g.fillRect(0,0,4,256);const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;scene.background=t;}
scene.fog=new THREE.Fog(0x0e1a4a,16,45);
const cam=new THREE.PerspectiveCamera(32,540/960,0.1,100);
scene.add(new THREE.HemisphereLight(0xbfc8ff,0x20143a,1.1));
const key=new THREE.DirectionalLight(0xffffff,2.2);key.position.set(3,6,6);scene.add(key);
const rim=new THREE.DirectionalLight(LIL,2.5);rim.position.set(-5,3,-4);scene.add(rim);
const rim2=new THREE.DirectionalLight(TANG,1.6);rim2.position.set(5,2,-4);scene.add(rim2);
const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.75,flatShading:true,...o});
const box=(w,h,d,m,x=0,y=0,z=0,p)=>{const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);b.position.set(x,y,z);(p||scene).add(b);return b;};
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
// bokeh
{const cv=document.createElement('canvas');cv.width=cv.height=64;const g=cv.getContext('2d');
 const r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.5,'rgba(255,255,255,.5)');r.addColorStop(1,'rgba(255,255,255,0)');
 g.fillStyle=r;g.fillRect(0,0,64,64);const tex=new THREE.CanvasTexture(cv);
 const cols=[TANG,LIL,0x5c7cff,0xffc46b];
 for(let i=0;i<80;i++){const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,color:cols[i%4],transparent:true,opacity:.25+rnd()*.45,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
  sp.position.set((rnd()-.5)*34,rnd()*14-1,-8-rnd()*18);const k=.4+rnd()*1.4;sp.scale.set(k,k,1);scene.add(sp);}}
// skyline blocks
for(let i=0;i<26;i++){const h=2+rnd()*9,w=1+rnd()*2.2;const b=box(w,h,1.5,M(0x161a44,{emissive:0x0b0d2a}),(i-13)*2.3+rnd(),-2.2+h/2,-20-rnd()*6);
 for(let k=0;k<5;k++){if(rnd()<.5)continue;box(.25,.25,.05,new THREE.MeshBasicMaterial({color:[TANG,LIL,0xffd27a][k%3],fog:false}),(rnd()-.5)*w*.7,(rnd()-.5)*h*.8,.76,b);}}
{const g=new THREE.GridHelper(80,80,0x3a3aa0,0x24246a);g.position.y=-2.2;g.material.transparent=true;g.material.opacity=.5;scene.add(g);}

// ---------- easing ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=t=>{t=clamp(t);return 1-Math.pow(1-t,3);};
const back=t=>{t=clamp(t);const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const lerp=(a,b,t)=>a+(b-a)*t;
const pulse=(t,a,b)=>t>=a&&t<b;

// ---------- characters ----------
const skinM=M(0xffc9a8);
function face(head,z,opts={}){
 const eyes=[-.28,.28].map(x=>{const e=box(.28,.3,.05,M(0xffffff),x,.12,z,head);box(.12,.15,.03,M(0x111111),0,-.02,.03,e);return e;});
 const brows=[-.28,.28].map(x=>box(.32,.08,.05,M(INK),x,.36,z+.01,head));
 const mouth=box(.34,.08,.05,M(INK),0,-.3,z+.005,head);
 return {eyes,brows,mouth};
}
function makeChar(kind,opt={}){
 const g=new THREE.Group();scene.add(g);
 let bodyCol=PAPER,h=1.25,hw=1.1;
 const C={g,kind,talking:false};
 if(kind==='brian'){bodyCol=PAPER;}
 if(kind==='benny')bodyCol=0x6b4226;
 if(kind==='tea')bodyCol=0x3fae5a;
 if(kind==='brick')bodyCol=0xf2f2f2;
 if(kind==='shroom')bodyCol=0xeee2c8;
 if(kind==='teacher')bodyCol=0x3b4f8a;
 if(kind==='grandma')bodyCol=0xd77fb0;
 if(kind==='npc')bodyCol=opt.color||0x888888;
 const bm=M(bodyCol);
 box(1.5,1.7,.85,bm,0,-1.1,0,g);
 if(kind==='brian'){box(.42,1.2,.04,M(INK),0,-.8,.44,g);box(.12,.9,.03,M(TANG),0,-.75,.465,g);box(.35,.12,.05,M(LIL),.45,-.6,.45,g);}
 if(kind==='benny'){for(let i=0;i<6;i++)box(.18,.26,.04,M(0x3a2010),-.5+(i%3)*.5,-.6-Math.floor(i/2)%2*.6-(i>3?.3:0),.44,g);box(1.2,.3,.06,M(0x7d5232),0,-1.65,.44,g);}
 if(kind==='tea'){box(1.0,.3,.06,M(0x2f8a45),0,-1.65,.44,g);box(.12,.5,.05,M(0xffffff),.35,-.55,.44,g);}
 if(kind==='brick'){for(let i=0;i<4;i++){const s=box(1.52,.16,.87,M(i%2?LIL:TANG),0,-.5-i*.3,0,g);}}
 const armM=kind==='brick'?skinM:bm;const aw=kind==='brick'?.55:.42;
 const mk=(sx)=>{const a=new THREE.Group();a.position.set(sx*(.75+aw/2),-.35,0);g.add(a);box(aw,1.5,.5,armM,0,-.7,0,a);box(.36,.3,.4,skinM,0,-1.55,0,a);return a;};
 C.armL=mk(-1);C.armR=mk(1);
 box(.4,.2,.4,skinM,0,-.15,0,g);
 const head=new THREE.Group();head.position.set(0,.65,0);g.add(head);C.head=head;
 if(kind==='brian'){
  box(.75,1.25,1.25,M(TANG),-.375,0,0,head);box(.75,1.25,1.25,M(LIL),.375,0,0,head);
  [[-.5,.68,.2,TANG],[-.2,.7,-.3,TANG],[-.45,.66,-.45,TANG],[.25,.7,.25,LIL],[.5,.66,-.2,LIL],[.2,.69,-.45,LIL],[-.2,.7,.35,TANG],[.5,.68,.35,LIL]].forEach(([x,y,z,c])=>box(.42,.22,.38,M(c),x,y,z,head));
  box(.04,1.3,1.27,M(0xffffff,{emissive:0x553366}),0,0,0,head);
  Object.assign(C,face(head,.64));
 } else {
  box(1.15,1.2,1.15,skinM,0,0,0,head);
  Object.assign(C,face(head,.6));
  if(kind==='benny'){ // paper cup hat
   const cup=new THREE.Mesh(new THREE.CylinderGeometry(.5,.38,.9,10),M(0xfdfaf2));cup.position.y=1.05;head.add(cup);
   const sl=new THREE.Mesh(new THREE.CylinderGeometry(.47,.42,.35,10),M(0x8a5a32));sl.position.y=1.0;head.add(sl);
   const lid=new THREE.Mesh(new THREE.CylinderGeometry(.54,.54,.12,10),M(0x2a1a10));lid.position.y=1.52;head.add(lid);
   box(1.2,.25,1.2,M(0x3a2010),0,.6,0,head);
  }
  if(kind==='tea'){box(1.2,.28,1.2,M(0x5a3a22),0,.62,0,head);box(.08,.5,.08,M(0x2f8a45),0,1.0,0,head);
   const l1=box(.5,.08,.28,M(0x58d46e),.25,1.25,0,head);l1.rotation.z=.4;const l2=box(.5,.08,.28,M(0x58d46e),-.25,1.2,0,head);l2.rotation.z=-.4;}
  if(kind==='brick'){box(1.2,.18,1.2,M(0x1c1410),0,.62,0,head);g.scale.setScalar(1.18);}
  if(kind==='shroom'){box(1.35,.55,1.35,M(0xeee2c8),0,.55,-.05,head);box(1.35,1.0,.2,M(0xeee2c8),0,.1,-.62,head);C.eyes&&C.eyes.forEach(e=>e.scale.y=.4);}
  if(kind==='teacher'){box(1.2,.22,1.2,M(0x3a2a1a),0,.62,0,head);[-.28,.28].forEach(x=>{const f=box(.38,.36,.04,M(0x111111),x,.12,.64,head);f.material.transparent=true;f.material.opacity=.55;});box(.2,.05,.04,M(0x111111),0,.16,.65,head);}
  if(kind==='grandma'){box(1.22,.3,1.22,M(0xdddddd),0,.6,0,head);box(.55,.45,.55,M(0xdddddd),0,.95,-.2,head);}
  if(kind==='npc'){box(1.2,.24,1.2,M(opt.hair||0x2a1a10),0,.62,0,head);}
 }
 C.update=(t)=>{
  const talk=C.talking;
  C.mouth.scale.y=talk?1+3.2*Math.abs(Math.sin(t*17)*Math.sin(t*5.3)):1;
  const blink=((t+(kind.length*.37))%2.7)>2.56?.1:1;C.eyes.forEach(e=>e.scale.y=blink);
  head.rotation.z=Math.sin(t*2.1+kind.length)*.05;head.rotation.y=Math.sin(t*1.3)*.12+(C.look||0);
  head.position.y=.65+(talk?Math.abs(Math.sin(t*4))*.04:Math.sin(t*1.5)*.015);
 };
 C.pose=(name,amt)=>{ // amt 0..1
  if(name==='point'){C.armR.rotation.z=amt*1.9;C.armR.rotation.x=-amt*.4;}
  if(name==='thumbs'){C.armR.rotation.z=amt*2.6;C.armR.rotation.x=0;}
  if(name==='flex'){C.armL.rotation.z=-amt*2.4;C.armR.rotation.z=amt*2.4;C.armL.rotation.x=C.armR.rotation.x=0;}
  if(name==='tap'){C.armR.rotation.x=-amt*1.3;C.armR.rotation.z=amt*.2;}
  if(name==='rest'){C.armL.rotation.set(0,0,-Math.sin(amt*3)*.05);C.armR.rotation.set(0,0,Math.sin(amt*3)*.05);}
  if(name==='raiseL'){C.armL.rotation.z=-amt*2.8;}
 };
 C.brows=C.brows;
 return C;
}

// ---------- cards (canvas planes) ----------
function card(w,h,px=320,draw){
 const cv=document.createElement('canvas');cv.width=Math.round(px*w);cv.height=Math.round(px*h);
 const tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=8;
 const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex,transparent:true,fog:false}));
 scene.add(m);m.visible=false;
 const g=cv.getContext('2d');
 m.redraw=(...a)=>{g.clearRect(0,0,cv.width,cv.height);draw(g,cv.width,cv.height,...a);tex.needsUpdate=true;};
 return m;
}
function panel(g,W,H){g.fillStyle='#14121c';g.beginPath();g.roundRect(4,4,W-8,H-8,40);g.fill();g.strokeStyle='#2c2840';g.lineWidth=6;g.stroke();}
const F=(w,s)=>`${w} ${s}px Inter`;

// ---------- props ----------
function jars(n=5){const arr=[];const cols=[0x2fbf71,0xffc23a,0x4aa3ff,0xff6fa8,0xffffff];
 for(let i=0;i<n;i++){const g=new THREE.Group();const mat=M(cols[i%5]);
  const b=new THREE.Mesh(new THREE.CylinderGeometry(.32,.32,.8,8),mat);g.add(b);
  const lid=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.18,8),M(INK));lid.position.y=.48;g.add(lid);
  const lab=new THREE.Mesh(new THREE.CylinderGeometry(.325,.325,.36,8),M(PAPER));g.add(lab);
  scene.add(g);g.mat=mat;arr.push(g);}return arr;}
function coins(n=18){const arr=[];for(let i=0;i<n;i++){const c=new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,.05,10),M(0xffc23a,{emissive:0x664400,metalness:.3}));c.rotation.x=Math.PI/2;c.visible=false;scene.add(c);c.v=[(rnd()-.5)*3,2+rnd()*3,(rnd()-.2)*1.5];c.s=rnd()*6;arr.push(c);}return arr;}
function burst(arr,t,t0,origin){arr.forEach(c=>{const d=t-t0;c.visible=d>0&&d<2.2;if(!c.visible)return;
 c.position.set(origin[0]+c.v[0]*d,origin[1]+c.v[1]*d-4.9*d*d*.5,origin[2]+c.v[2]*d);c.rotation.y=c.s+d*8;c.rotation.z=d*5;});}
function confetti(n=60){const arr=[];const cols=[TANG,LIL,0xffc23a,0x58d46e,0x5c7cff];for(let i=0;i<n;i++){const c=box(.14,.14,.14,new THREE.MeshBasicMaterial({color:cols[i%5],fog:false}),0,0,0);c.visible=false;c.v=[(rnd()-.5)*6,3+rnd()*4,(rnd()-.3)*2];c.s=rnd()*6;arr.push(c);}return arr;}

const S={THREE,scene,cam,M,box,makeChar,card,panel,F,jars,coins,burst,confetti,ease,back,lerp,clamp,pulse,rnd,TANG,LIL,INK,PAPER};

// ---------- captions ----------
const disp=EP.display.trim().split(/\s+/);
if(disp.length!==WORDS.length)console.log('WORDCOUNT MISMATCH',disp.length,WORDS.length);
const toks=WORDS.map((w,i)=>({t0:w[1],t1:w[2],txt:disp[i]||'',hidden:(disp[i]||'').startsWith('_')}));
// chunks
const chunks=[];let cur=[];
toks.forEach((k,i)=>{cur.push(i);const vis=cur.filter(j=>!toks[j].hidden).length;
 const end=/[.,!?…:"]$/.test(k.txt)||vis>=4;
 const nextHidden=toks[i+1]&&toks[i+1].hidden;
 if(end&&!nextHidden){chunks.push(cur);cur=[];}});
if(cur.length)chunks.push(cur);
const isHL=s=>{const c=s.replace(/[^A-Za-z0-9$]/g,'');return /[$0-9]/.test(c)||(c.length>1&&c===c.toUpperCase());};
const T=(i)=>toks[Math.min(i,toks.length-1)].t0; // time of word index
S.T=T;S.words=toks;
function caption(t){
 let ci=-1;for(let c=0;c<chunks.length;c++){if(t>=toks[chunks[c][0]].t0-.05)ci=c;}
 const el=document.getElementById('cap');
 if(ci<0){el.innerHTML='';return;}
 const ch=chunks[ci];const lastEnd=toks[ch[ch.length-1]].t1;
 if(ci===chunks.length-1&&t>lastEnd+1.2){el.innerHTML='';return;}
 el.innerHTML=ch.filter(j=>!toks[j].hidden).map(j=>{const k=toks[j];if(t<k.t0-.05)return '';
  const now=t<k.t1+.02&&t>=k.t0-.05;return `<span class="${isHL(k.txt)?'hl':''} ${now?'now':''}">${k.txt.replace(/^"|"$/g,'')}</span>`;}).join(' ');
}
S.speaking=t=>toks.some(k=>t>=k.t0&&t<k.t1+.03);
const pillEl=document.getElementById('pill'),ctaEl=document.getElementById('cta');
S.pill=h=>{if(pillEl.innerHTML!==h)pillEl.innerHTML=h;};
S.cta=(txt,s)=>{ctaEl.textContent=txt;ctaEl.style.setProperty('--s',s);};

EP.build(S);
window.DURATION=EP.duration(S);
window.renderAt=function(t){
 caption(t);
 EP.update(t,S);
 renderer.render(scene,cam);
};
window.renderAt(0);window.READY=true;
</script></body></html>
