<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:540px;height:960px;overflow:hidden;background:#0b1030;font-family:Inter, sans-serif}
#c{position:absolute;inset:0}
#pill{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#0d0c12;color:#fff;font-weight:900;font-size:22px;letter-spacing:.04em;padding:10px 20px;border-radius:14px;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#pill b{color:#FF5A36}
#cap{position:absolute;top:560px;left:30px;right:30px;text-align:center;font-weight:900;font-size:46px;line-height:1.08;color:#fff;
 -webkit-text-stroke:9px #000;paint-order:stroke fill;text-shadow:0 5px 0 #000}
#cap span{display:inline-block;margin:0 .12em;transform-origin:50% 80%}
#cap .hl{color:#FF5A36}
#cap .now{transform:scale(1.12)}
</style></head><body>
<canvas id="c" width="540" height="960"></canvas>
<div id="pill"></div><div id="cap"></div>
<script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const TANG=0xFF5A36, LIL=0xB7A6FF, INK=0x15131C, PAPER=0xF7F4EE;
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(window.devicePixelRatio); renderer.setSize(540,960);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
const scene=new THREE.Scene();
// gradient bg
{const cv=document.createElement('canvas');cv.width=4;cv.height=256;const g=cv.getContext('2d');
 const gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#1b1460');gr.addColorStop(.55,'#0e1a4a');gr.addColorStop(1,'#060818');
 g.fillStyle=gr;g.fillRect(0,0,4,256);const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;scene.background=t;}
scene.fog=new THREE.Fog(0x0e1a4a,14,40);
const cam=new THREE.PerspectiveCamera(32,540/960,0.1,100);

scene.add(new THREE.HemisphereLight(0xbfc8ff,0x20143a,1.1));
const key=new THREE.DirectionalLight(0xffffff,2.2);key.position.set(3,6,6);scene.add(key);
const rim=new THREE.DirectionalLight(LIL,2.5);rim.position.set(-5,3,-4);scene.add(rim);
const rim2=new THREE.DirectionalLight(TANG,1.6);rim2.position.set(5,2,-4);scene.add(rim2);

const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.75,flatShading:true,...o});
const box=(w,h,d,m,x=0,y=0,z=0,p)=>{const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);b.position.set(x,y,z);(p||scene).add(b);return b;};

// bokeh
{const cv=document.createElement('canvas');cv.width=cv.height=64;const g=cv.getContext('2d');
 const r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.5,'rgba(255,255,255,.5)');r.addColorStop(1,'rgba(255,255,255,0)');
 g.fillStyle=r;g.fillRect(0,0,64,64);const tex=new THREE.CanvasTexture(cv);
 const cols=[TANG,LIL,0x5c7cff,0xffc46b];let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
 for(let i=0;i<70;i++){const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,color:cols[i%4],transparent:true,opacity:.25+rnd()*.45,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
  sp.position.set((rnd()-.5)*30,rnd()*12-1,-8-rnd()*18);const k=.4+rnd()*1.4;sp.scale.set(k,k,1);scene.add(sp);}}
// floor
{const g=new THREE.GridHelper(60,60,0x3a3aa0,0x24246a);g.position.y=-2.2;g.material.transparent=true;g.material.opacity=.5;scene.add(g);}

// ---- Blocky Brian ----
const brian=new THREE.Group();scene.add(brian);
const coat=M(PAPER),ink=M(INK),skin=M(0xffc9a8);
const torso=box(1.5,1.7,.85,coat,0,-1.1,0,brian);
box(.42,1.2,.04,ink,0,-.8,.44,brian);            // shirt strip
box(.12,.9,.03,M(TANG),0,-.75,.465,brian);       // tie
box(.35,.12,.05,M(LIL),.45,-.6,.45,brian);       // pocket pen
const armL=new THREE.Group();armL.position.set(-.95,-.35,0);brian.add(armL);box(.42,1.5,.5,coat,0,-.7,0,armL);box(.36,.3,.4,skin,0,-1.55,0,armL);
const armR=new THREE.Group();armR.position.set(.95,-.35,0);brian.add(armR);box(.42,1.5,.5,coat,0,-.7,0,armR);box(.36,.3,.4,skin,0,-1.55,0,armR);
box(.4,.2,.4,skin,0,-.15,0,brian); // neck
const head=new THREE.Group();head.position.set(0,.65,0);brian.add(head);
box(.75,1.25,1.25,M(TANG),-.375,0,0,head); box(.75,1.25,1.25,M(LIL),.375,0,0,head);
// brain folds (low-poly bumps)
[[-.5,.68,.2,TANG],[-.2,.7,-.3,TANG],[-.45,.66,-.45,TANG],[.25,.7,.25,LIL],[.5,.66,-.2,LIL],[.2,.69,-.45,LIL],[-.2,.7,.35,TANG],[.5,.68,.35,LIL]]
 .forEach(([x,y,z,c])=>box(.42,.22,.38,M(c),x,y,z,head));
box(.04,1.3,1.27,M(0xffffff,{emissive:0x553366}),0,0,0,head); // seam
const eyeW=M(0xffffff),pup=M(0x111111);
const eyes=[-.3,.3].map(x=>{const e=box(.3,.32,.05,eyeW,x,.1,.64,head);box(.13,.16,.03,pup,0,-.02,.03,e);return e;});
const brows=[-.3,.3].map(x=>box(.34,.08,.05,ink,x,.36,.65,head));
const mouth=box(.36,.08,.05,ink,0,-.32,.645,head);

// ---- jar stack ----
const jars=[];
const jarCols=[0x2fbf71,0xffc23a,0x4aa3ff,0xff6fa8,0xffffff];
jarCols.forEach((c,i)=>{const g=new THREE.Group();
 const b=new THREE.Mesh(new THREE.CylinderGeometry(.32,.32,.8,8),M(c));g.add(b);
 const lid=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.18,8),M(INK));lid.position.y=.48;g.add(lid);
 const lab=new THREE.Mesh(new THREE.CylinderGeometry(.325,.325,.36,8),M(PAPER));g.add(lab);
 scene.add(g);jars.push({g,x:-1.35+i*.68,dly:i*.09});});
const desk=box(4.2,.25,1.6,M(0x2a2350),0,-2.05,1.1);

// ---- verdict card ----
const cardCv=document.createElement('canvas');cardCv.width=640;cardCv.height=440;
{const g=cardCv.getContext('2d');g.fillStyle='#14121c';g.beginPath();g.roundRect(0,0,640,440,36);g.fill();
 g.strokeStyle='#2c2840';g.lineWidth=4;g.stroke();
 g.fillStyle='#8e88a8';g.font='800 26px Inter';g.fillText('DAY 21 · BLIND TEST RESULT',40,64);
 g.fillStyle='#fff';g.font='900 46px Inter';g.fillText('Your morning stack',40,124);
 const bar=(y,l,w,c,v)=>{g.fillStyle='#8e88a8';g.font='800 24px Inter';g.fillText(l,40,y+28);g.fillStyle='#262236';g.beginPath();g.roundRect(150,y,440,40,12);g.fill();g.fillStyle=c;g.beginPath();g.roundRect(150,y,w,40,12);g.fill();g.fillStyle='#fff';g.font='900 24px Inter';g.fillText(v,150+w-80,y+29);};
 bar(170,'ON',400,'#FF5A36','271ms');bar(230,'OFF',300,'#B7A6FF','298ms');
 g.fillStyle='#2fbf71';g.beginPath();g.roundRect(40,312,560,88,20);g.fill();
 g.fillStyle='#062a16';g.font='900 40px Inter';g.fillText('✓  KEEP IT — it works for YOU',62,370);}
const cardTex=new THREE.CanvasTexture(cardCv);cardTex.colorSpace=THREE.SRGBColorSpace;cardTex.anisotropy=8;
const card=new THREE.Mesh(new THREE.PlaneGeometry(3.2,2.2),new THREE.MeshBasicMaterial({map:cardTex,transparent:true,fog:false}));
scene.add(card);

// ---- timeline ----
const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3);
const back=t=>{t=Math.max(0,Math.min(1,t));const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const lerp=(a,b,t)=>a+(b-a)*t;
const LINES=[
 {t0:0.0,t1:2.4,pill:'WHAT <b>IF?</b>',words:['You','spend','<hl>$90','a','month','on','<hl>THIS.']},
 {t0:2.4,t1:5.0,pill:'WHAT <b>IF?</b>',words:['What','if','it','had','to','<hl>PROVE','it','works?']},
 {t0:5.0,t1:9.0,pill:'<b>21</b> DAYS LATER',words:['Placebo','runs','the','<hl>blind','<hl>test','for','you.']},
];
function caption(t){const L=LINES.find(l=>t>=l.t0&&t<l.t1)||LINES[LINES.length-1];
 document.getElementById('pill').innerHTML=L.pill;
 const dur=(L.t1-L.t0)*0.8, per=dur/L.words.length, k=Math.floor((t-L.t0)/per);
 document.getElementById('cap').innerHTML=L.words.map((w,i)=>{if(i>k)return'';const hl=w.startsWith('<hl>');w=w.replace('<hl>','');
  return `<span class="${hl?'hl':''} ${i===k?'now':''}">${w}</span>`;}).join(' ');
 return L;}
window.renderAt=function(t){
 caption(t);
 const speaking=LINES.some(l=>t>=l.t0&&t<l.t0+(l.t1-l.t0)*.85);
 mouth.scale.y=speaking?1+3.2*Math.abs(Math.sin(t*17)*Math.sin(t*5.3)):1;
 const blink=(t%2.7)>2.55?.1:1;eyes.forEach(e=>e.scale.y=blink);
 head.rotation.z=Math.sin(t*2.1)*.05;head.rotation.y=Math.sin(t*1.3)*.12;head.position.y=.65+Math.abs(Math.sin(t*4))*.04;
 // jars slam at 0.15s
 jars.forEach(j=>{const p=back((t-.1-j.dly)/.35);j.g.position.set(j.x,lerp(6,-1.5,p),1.35);j.g.rotation.z=(1-p)*.6;});
 // brows pop on "THIS"
 brows.forEach((b,i)=>{b.position.y=.36+(t>1.6&&t<2.6?.08:0);b.rotation.z=(t>2.4&&t<5?(i?-.2:.2):0);});
 // arm point
 const pt=ease((t-2.5)/.4)*(1-ease((t-4.6)/.3));armR.rotation.z=pt*1.9;armR.rotation.x=-pt*.4;
 armL.rotation.z=-Math.sin(t*3)*.05;
 // card
 const cp=back((t-5.1)/.6);card.position.set(lerp(6,.25,cp),1.3,2.2);card.rotation.y=lerp(-1.2,-.1,cp);card.scale.setScalar(lerp(.4,.78,cp));
 brian.position.x=lerp(0,-1.25,ease((t-5.0)/.6));
 // camera: punch-in → pull back → reframe
 let cx=0,cy=.7,cz=8,ty=.55;
 if(t<.12){cz=4.6;ty=.6;cy=.7;}
 else if(t<2.4){const e=ease((t-.12)/2.2);cz=lerp(5.4,8.5,e);cy=lerp(.7,.3,e);ty=lerp(.6,-.4,e);}
 else if(t<5){cz=lerp(11,12,(t-2.4)/2.6);cy=.6;ty=-.5;cx=Math.sin(t)*.3;}
 else {const e=ease((t-5)/3);cz=lerp(14,13,e);cy=1;ty=.25;cx=lerp(-.5,0,e);}
 cam.position.set(cx,cy,cz);cam.lookAt(cx*.5,ty,0);
 renderer.render(scene,cam);
};
window.renderAt(0);window.READY=true;
</script></body></html>
